name: Validar Scripts do Patcher

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Rodar testes unitarios
        run: python3 -m unittest discover -s tests -v
